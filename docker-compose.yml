# PartyPic zum Selbsthosten: "docker compose up -d" und die App laeuft auf
# http://localhost:8080. Alles Noetige startet mit — Datenbank, Bildspeicher, App.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: partypic
      POSTGRES_PASSWORD: ${DB_PASSWORD:-partypic}
      POSTGRES_DB: partypic
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partypic"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_USER:-partypic}
      MINIO_ROOT_PASSWORD: ${STORAGE_PASSWORD:-partypic-secret}
    volumes:
      - photo-data:/data
    ports:
      # Die Bilder laufen per presigned URL direkt zwischen Browser und Storage —
      # dieser Port muss also fuer die Geraete der Gaeste erreichbar sein.
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ghcr.io/benediktnau/partypic:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__partypicdb: "Host=db;Database=partypic;Username=partypic;Password=${DB_PASSWORD:-partypic}"

      PartyPic__Storage__ServiceUrl: "http://storage:9000"
      # Die Adresse, unter der die Geraete der Gaeste den Storage sehen. Im heimischen
      # WLAN die Host-IP eintragen (z. B. http://192.168.1.20:9000) — "localhost" zeigt
      # auf dem Handy auf das Handy selbst, und die Bilder blieben grau.
      PartyPic__Storage__PublicUrl: "${PUBLIC_STORAGE_URL:-http://localhost:9000}"
      PartyPic__Storage__AccessKey: "${STORAGE_USER:-partypic}"
      PartyPic__Storage__SecretKey: "${STORAGE_PASSWORD:-partypic-secret}"

      # Ohne gesetztes Secret wuerfelt die App bei jedem Start ein neues — dann muessen
      # sich nach einem Neustart alle neu anmelden.
      PartyPic__Jwt__Secret: "${JWT_SECRET:?bitte in .env setzen, mindestens 32 Zeichen}"

      # Auf "false" stellen, sobald der eigene Account angelegt ist.
      PartyPic__AllowRegistration: "${ALLOW_REGISTRATION:-true}"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/alive || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db-data:
  photo-data:
