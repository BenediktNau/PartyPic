name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Ein laufender Build pro Branch reicht — ein Nachschieben macht den vorigen wertlos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PartyPic.slnx

      - name: Build
        run: dotnet build PartyPic.slnx --no-restore -c Release

      # Die Testsuite laeuft gegen SQLite in-memory und braucht daher weder
      # Postgres noch MinIO noch Docker.
      - name: Test
        run: dotnet test PartyPic.slnx --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Bekannte Schwachstellen in Abhaengigkeiten
        # Ohne pipefail verschluckt die Pipe den Exit-Code von "dotnet list": ein
        # abgebrochener Scan (NuGet nicht erreichbar) haette den Schritt still bestehen
        # lassen, statt den Build rot zu faerben.
        shell: bash
        run: |
          set -o pipefail
          dotnet list PartyPic.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Abhaengigkeiten mit bekannten Schwachstellen gefunden."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  container:
    name: Container-Image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: An der Registry anmelden
        # Auf Pull Requests aus Forks gibt es kein Push-Token — dann wird nur gebaut.
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Bauen und ggf. pushen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
