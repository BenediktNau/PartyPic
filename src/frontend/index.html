<!doctype html>
<html lang="de" class="dark">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover ist die Voraussetzung dafür, dass env(safe-area-inset-*) auf
       Geräten mit Notch überhaupt Werte liefert. Kein user-scalable=no: Zoom zu
       verbieten hilft niemandem und wird von iOS ohnehin ignoriert. Die 16px auf
       Eingabefeldern (siehe index.css) verhindern das automatische Hineinzoomen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a12" />
  <meta name="description" content="Fotos sammeln auf jeder Feier — Link teilen, knipsen, gemeinsame Galerie." />

  <title>PartyPic</title>

  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PartyPic" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
